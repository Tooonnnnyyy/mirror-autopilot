(20s and 30s)","url":"https://www.meetup.com/ottawa-social-meetup-group/"},"performer":"National Social Networking Group - Ottawa (20s and 30s)"},{"@context":"https://schema.org","@type":"Event","name":"(un)told: An Evening of Personal Stories","url":"https://www.meetup.com/storytelling-events-in-ottawa/events/314083713/","description":"(un)Told is a monthly gathering built around a simple idea: everyone has a story worth telling, and storytelling is something you learn by being in the room.\n\nThis is a cross-cultural, come-as-you-are night of real, personal stories told live in ten minutes or less. No notes, no sets, no props, and no pressure to perform. Some people share. Many listen. All of it counts.\n\n#### What to expect\n\n**Listening is welcome: Many people just come to listen. There’s no expectation to share.**\n**Sharing is arranged in advance: If you’d like to tell a story, contact Brad ahead of time so we can make sure it’s a good fit.**\n**Everyday stories are valued: Your story doesn’t need to be polished. Ordinary moments often resonate the most.**\n**Support is available: Story coaches are usually present. Coaching is optional and informal.**\n**Learning happens by listening: Even if you never tell a story, you’ll learn how storytelling works.**\n\n#### Thinking about telling a story?\n\n####\n\nIf you’re considering sharing a story and want to talk it through first, reach out to Brad. This isn’t an audition or a commitment - just a way to make sure (un)Told is the right fit for you and your story.\nTo help Brad understand what you’re thinking, include:\n\n1. What your story is about (a sentence or two)\n2. Why this story matters to you right now\n3. Whether you’d like any support (optio\n\nEmail Brad at: [untold@ottawastorytellers.ca](mailto:untold@ottawastorytellers.ca?subject=Telling%20at%20unTold&body=To%20help%20Brad%20understand%20what%20you%E2%80%99re%20thinking%2C%20include%3A%0AWhat%20your%20story%20is%20about%20(a%20sentence%20or%20two)%0AWhy%20this%20story%20matters%20to%20you%20right%20now%0AWhether%20you%E2%80%99d%20like%20any%20support%20(optional))\n*Note:* (un)Told focuses on personal stories, not speeches, debates, or advocacy.\nIf you’re unsure whether your story fits, Brad is happy to talk it through.\n\n####\n\n(un)Told is free to attend.\n\nFourth Sunday of each month at 7:00 PM EST\nCarleton Dominion-Chalmers Centre\n355 Cooper Street, Room 14\n**Join the room. Listening is welcome.**","startDate":"2026-11-23T00:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Carleton Dominion-Chalmers Centre","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"290 Lisgar Street, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Storytelling Events in Ottawa","url":"https://www.meetup.com/storytelling-events-in-ottawa/"},"performer":"Storytelling Events in Ottawa"},{"@context":"https://schema.org","@type":"Event","name":"Yoga at the Bethell Field House","url":"https://www.meetup.com/ottawa-yoga-and-social-club/events/316964031/","description":"**(We also have an Instagram page! Follow us at [@ottawa_yoga_and_social_club](https://www.instagram.com/ottawa_yoga_and_social_club/))**\n\nJoin us for a **yoga session at the Bethell Field House.**\n\nYou need only bring a yoga mat or towel if you'd like to use one. We’ll start with a brief meet-and-greet, followed by a **50-minute yoga session** suitable for all levels.\n\n**Sometimes, after yoga, we head out for a social gathering!** When we do, it’s usually at McLaren’s Pool Hall, where you’re welcome to join us for a relaxed game of pool. No experience is needed—we’re happy to show you how to play!\n\nIf you're interested in **leading a yoga session**, let me know! I appreciate it when members help guide the practice.\n\nLastly, if you **enjoy the club** and want to support us, please consider donating! Your contributions help keep these sessions going. Thank you for your generosity.\n👉 **Donate via PayPal:** [Make a donation using Paypal](https://www.paypal.com/donate/?hosted_button_id=C5J8H7P6WMQS4)","startDate":"2026-11-16T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Bethell Fieldhouse","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"166 Frank St, Ottawa, ON K2P 0Y3, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Ottawa Yoga and Social Club","url":"https://www.meetup.com/ottawa-yoga-and-social-club/"},"performer":"Ottawa Yoga and Social Club"},{"@context":"https://schema.org","@type":"Event","name":"A TON of Demos - At the Prescott on Preston Street  ","url":"https://www.meetup.com/the-ottawa-network/events/317308035/","description":"The next TON of Demos is live at The Prescott.\n379 Preston St · Ottawa, ON\n\nIf this is your first time, here’s a primer of how TON of Demos works:\n\n1. You show up and meet some great people.\n2. An Ottawa innovator does a pitch of their company/product/model.\n3. The rest of us get excited about a great new company in Ottawa.\n4. Some people ask some questions to help the innovator move ahead or provide useful or encouraging feedback.\n5. Repeat steps 2-4, 2-3 more times.\n6. You meet some more great people.\n\nOptional extra steps:\n\nYou get a drink and/or something to eat.\n\nAll are welcomed to attend.\n\nSee you there!","startDate":"2026-11-25T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-2-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"The Prescott","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"379 Preston St, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"The Ottawa Network","url":"https://www.meetup.com/the-ottawa-network/"},"performer":"The Ottawa Network"},{"@context":"https://schema.org","@type":"Event","name":"Guatemala – Volcanoes, Jungles and Ancient Mayan Cities","url":"https://www.meetup.com/original-ottawa-travel-meetup-non-commercial/events/316666713/","description":"***NOTE***\\*: If you register and have to cancel, please cancel on this platform so that people on the waitlist can take your place)\\*\n\nGuatemala was one of 5 countries that Ben visited this past summer. He will be showing everyone the highlights of the World Heritage historical colonial city Antigua, Pacaya Volcano hike, Panajachel, Lake Atitlan, Semuc Champey, and another World Heritage site - the famous Mayan city of Tikal.\n\n*(NOTE: The restaurant does not charge us for the use of their private room, nor for the use of their audio-visual equipment, but... they expect you to have your dinner there)*","startDate":"2026-11-16T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"1130 St. Laurent Blvd","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"1130 St. Laurent Blvd, Ottawa, ON K1K 3B6, Canada, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Ottawa Travel Meetup","url":"https://www.meetup.com/original-ottawa-travel-meetup-non-commercial/"},"performer":"Ottawa Travel Meetup"},{"@context":"https://schema.org","@type":"Event","name":"A walk in the museum","url":"https://www.meetup.com/onecycling/events/317074961/","description":"🎨 What Is Art? A Walk Through the Ages, Part II – National Gallery\nJoin us for our second walk through the National Gallery of Canada, exploring how the meaning of “art” has changed over the centuries!\nWe’ll start in the medieval period and finish with a contemporary work, stopping at a handful of pieces in chronological order along the way. At each stop, we’ll ask a simple question: what did “art” mean to the people who made it, and what does it mean to us today? No lectures, just looking, chatting, and forming our own opinions.\nThis time we’ll visit different works from different countries than our first tour, so whether you joined us last time or not, there’s plenty new to discover.\nYou definitely don’t need to be an art expert. Curiosity is all you need!\n📅 Thursday, [Date]\n⏰ 6:30 PM sharp\n📍 National Gallery of Canada, Ottawa\n🎟️ Admission is free on Thursday evenings, but a ticket is required. Book yours online at gallery.ca or pick one up at the box office before we meet.\nWe’ll meet at the main entrance at 6:30 PM sharp and head inside together. The Gallery closes at 8:00 PM, so please be on time so we can make the most of the evening!\nCome on your own or bring a friend. Everyone is welcome!\nSee you at the Gallery! 🎨","startDate":"2026-11-19T23:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"National Gallery -  K1N 9N4","address":{"@type":"PostalAddress","addressLocality":"Ottawa,","addressRegion":"ON","addressCountry":"ca","streetAddress":"380 Sussex Dr,, Ottawa,, ON"}},"organizer":{"@type":"Organization","name":"One Cycling - Ottawa Cycling Group","url":"https://www.meetup.com/onecycling/"},"performer":"One Cycling - Ottawa Cycling Group"},{"@context":"https://schema.org","@type":"Event","name":"Projects Night - Bring your laptop, work on your idea","url":"https://www.meetup.com/minimum-viable-meetup-ottawa/events/317327624/","description":"A recurring meetup, every other Tuesday, for people who are building things.\n\n**Bring your laptop, build alongside others**\n6:00 PM - **Doors open (room #201)** / Welcome (Snacks and Refreshments)\n6:15 PM - Round table: Updates on our projects\n6:30 PM - **Solo work / hang out**\n8:30 PM - Close-out\n\n**Who it’s for:**\n\n* Creatives\n* Engineers\n* Designers\n* Marketers\n* Consultants\n* Builders and Founders\n* All of us practicing a *new skill*\n* **Inventors learning how to start a business, builders learning how to delegate to AI, engineers learning how to do marketing, freelancers learning how to break through, creatives learning to ship scary-important work, and all who dream of making a product.**\n\nIf you’re working on something (or want to start), and want a little momentum, community, or creative friction — you’re in the right place.\n\n**Why “Minimum Viable Meetup”?**\n\nBecause we’re all starting small, keeping it attainable, step by step.\nYou don’t need a finished project to show up, just a reason to build. Minimum Viable Product (MVP), Minimum Viable *Audience.*\n\n**The scarcity of \"I made this\"**\n\nNobody has any assurance that creating something new will be received with enthusiasm and interest, that it will work out. Maybe it's going to be your third, or fourth project that makes things happen for you. For many of us with an idea, maybe we won't ever get to finish at least one. That's why even despite today's abundance of tools arming the creatives, the real scarcity is people saying \"I made this. I made this for those of you who are unsatisfied, who want something new. I made this, and I'll be making more soon.\"\n\n**This event's quote:**\n“You get pseudo-order when you seek order; you only get a measure of order and control when you embrace randomness.”\n— Nassim N. Taleb in *Antifragile: Things That Gain From Disorder*\n\n**Space Sponsored by:**\nMBO CoWorking is graciously providing their space for the event. Check out their day rate and rent a hot desk on a weekday to support the event.\n\n**There will be light snacks**, and to help out the organizer, there'll be a QR code for those who would like to help pitch in a few dollars.\n\nHeads up: **we take a few photos** during Project Nights for. Let Pascal know if you'd rather not be in them.","startDate":"2026-11-17T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"MBO Coworking","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"78 George St #204, Ottawa, ON K1N 5W1, Canada, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Minimum Viable Meetup Ottawa","url":"https://www.meetup.com/minimum-viable-meetup-ottawa/"},"performer":"Minimum Viable Meetup Ottawa"},{"@context":"https://schema.org","@type":"Event","name":"Letting Go Seminar + Burning: The Whole Method in 2 Hours (Online)","url":"https://www.meetup.com/letting-go-workshops/events/317151071/","description":"https://us06web.zoom.us/j/85750240317?pwd=kggz8kBbabi7bjq09u5XUXk4EEvx6k.1\nPasscode: 123\n\n🔥 A special 2-hour Letting Go seminar with founder Dillon Freed, finished with a short Burning session!\n\nThis is a one-night deep dive where Dillon goes over everything: what letting go really is, why emotions stick, and how to release them at the root instead of managing them or pushing them down. Whether you're brand new or you've been coming for months, you'll leave with the full picture and a practice you can use every day. 💛\n\n✨ What we'll cover\n\n• What \"letting go\" actually means, and what it isn't\n\n• How feelings get stuck in the body and mind, and how to let them move through\n\n• Being a calm observer while feeling everything fully\n\n• The main Letting Go techniques we use in sessions, step by step\n\n• How to use it day to day: stress, anxiety, relationships, work, decisions\n\n• Your questions, answered live\n\n🔥 Then a short Burning\n\nWe'll close with a brief guided Burning session so you feel the method in action, not just hear about it.\n\n🗓 Wednesday, November 18 · 6:00–8:00pm ET\n\n💻 Online on Zoom (this replaces the regular Wednesday session that night)\n\n🙌 No experience needed. Come as you are!\n\n👋 About Dillon\n\nDillon Freed is the founder of Letting Go Center in NYC. He holds an M.S. in Cognitive Neuroscience and is a college professor, so he brings both the science of how emotions work and hands-on experience guiding people through letting go. He leads sessions every week for the Letting Go Center community, which has about 3,900 Meetup members and a 4.8★ rating. 💛\n\nMore at https://lettinggocenter.com 🙏","startDate":"2026-11-18T00:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-1-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/letting-go-workshops/events/317151071/"},"organizer":{"@type":"Organization","name":"Letting Go Workshops","url":"https://www.meetup.com/letting-go-workshops/"},"performer":"Letting Go Workshops"},{"@context":"https://schema.org","@type":"Event","name":"Storytelling Open Mic (in-person)","url":"https://www.meetup.com/storytelling-events-in-ottawa/events/315288098/","description":"Our in-person Storytelling Open Mic takes place monthly on a Wednesday evening at 7:00 pm at the Sunnyside OPL Branch (1049 Bank Street) in Room A. In-person Open Mic is hosted by **Véronique Dupuis**.\n\n**NOTE:** The Sunnyside OPL Branch is our home for Storytelling Open Mic!\nThank you to the Ottawa Public Library for being a partner and providing the space.\n\n#### **Step Into the World of Storytelling at the Storytelling Open Mic!**\n\nOpen Mic, formerly Swap, is warm and welcoming and offered on-line for those who want to participate from the comfort of their home and in person for those who love the live vibe.\n\n![Poster with words 'Storytelling Open Mic' and a microphone illustration.](https://images.squarespace-cdn.com/content/v1/6847001ae0b23339f66df42b/b6aa64f8-c5d7-41c8-8a9e-e8165d2b74b4/open+miclogo.png)\nStorytelling Open Mic is a perfect place to discover and enjoy storytelling as a teller or a listener. The supportive atmosphere is great for beginning tellers, and more experienced tellers can test out new material or share well-loved stories, both funny and poignant, including folk tales, historical pieces, fractured fairy tales, true personal stories, recitations, ballads, and original stories.\n\nWell-crafted stories of up to 10 minutes in length with beginnings, middles, and ends are told without notes from the heart of the teller to the hearts of the listeners.\n\n**Two Ways to Join**\nOttawa StoryTellers hosts this free event twice each month – once in person and once online. In either format, participants can choose to simply enjoy the stories or share one of their own, lasting between 5 and 10 minutes.","startDate":"2026-11-19T00:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Ottwaw Public Library Sunnyside Branch","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"1049 Bank Street, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Storytelling Events in Ottawa","url":"https://www.meetup.com/storytelling-events-in-ottawa/"},"performer":"Storytelling Events in Ottawa"},{"@context":"https://schema.org","@type":"Event","name":"Ottawa Civic Tech – Community Night #149","url":"https://www.meetup.com/yow_ct/events/317120934/","description":"Join us for Ottawa Civic Tech Community Night!\n\nOur community nights are casual, welcoming gatherings where people come together to connect, learn about community projects, exchange ideas, and meet others who care about using technology to make our communities better.\n\nWhether you're actively involved in a project, curious about what's happening in the community, looking to meet new people, or exploring ways to contribute, Community Night is a welcoming space to connect, learn, and share ideas.\n\nThroughout the evening, you'll have a chance to hear project updates from community members, discover initiatives that inspire you, meet potential collaborators, and build connections across sectors and disciplines. There will also be plenty of time to socialize, grab some food, and continue conversations with fellow community members.\n\n**Agenda**\n6:00 p.m. — Networking\n6:30 p.m. — Welcome + introductions\n6:45 p.m. — Featured project spotlight: Tech Meets World 2027\n7:00 p.m. — Breakouts and project discussions (including a workshop led by Tech Meets World)\n\n**More about Ottawa Civic Tech**\nUsing tech to do civic good. Ottawa Civic Tech (#YOWCT) connects people across sectors and silos to solve tough problems and make our communities better together.\nAs a civic tech group we provide a space for motivated individuals to connect and create projects for civic good. Community members bring their interests, insights, or skillsets like design, policy, community engagement, software development, and more.\nAll are welcome, including if you just want to learn and meet people, or if you’re not yet sure how you can contribute.\n\n**Stay connected**\n\n* Learn more at [ottawacivictech.ca](https://www.ottawacivictech.ca/)\n* [Follow us on LinkedIn](http://www.linkedin.com/company/ottawa-civic-tech/)\n* [Join us on Slack](https://join.slack.com/t/yowcivictech/shared_invite/zt-3cr6p30d2-4KeVDq91PLRV39g5g6Qc1A)","startDate":"2026-11-25T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Jock Turcot University Centre (UCU)","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"85 University Private, Ottawa, ON K1N 1H3, Canada, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Ottawa Civic Tech","url":"https://www.meetup.com/yow_ct/"},"performer":"Ottawa Civic Tech"},{"@context":"https://schema.org","@type":"Event","name":"Franco-Anglo.  6 language partners, half the time in each language","url":"https://www.meetup.com/french-96/events/317063176/","description":"FRANCO-ANGLO is a language exchange activity in pairs that enables fluent English speakers and fluent French speakers to meet to perfect second language skills. It is not a course: it is a social event. Each session lasts 15 minutes, half the time in French, half in English. You meet six different people in two hours. You can think of it as a sort of speed-dating for language learners... You’ll improve your target language while connecting with interesting people with whom you can talk about anything you like. And it’s a lot of fun.\nFRANCO-ANGLO est un échange linguistique permettant aux anglophones comme aux francophones d'accroître leurs compétences linguistiques. Ce n’est pas un cours, c'est une activité sociale. Chaque séance dure 15 minutes, la moitié en français, la moitié en anglais. Vous rencontrez six personnes différentes entre 16 h et 18 h. Franco-Anglo est en quelque sorte une forme de speed-dating mais pour les apprenants d’une des deux langues officielles ... Vous améliorerez votre langue cible lors de cet échange avec des gens intéressants, avec qui vous pouvez parler de n’importe quel sujet. D’une pierre deux coups : apprendre en s’amusant.","startDate":"2026-11-21T21:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"The Royal Oak - Kent at Slater","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"180 Kent St, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"Club Social Francophone et Francophile (CSFF)","url":"https://www.meetup.com/french-96/"},"performer":"Club Social Francophone et Francophile (CSFF)"},{"@context":"https://schema.org","@type":"Event","name":"Rendez-vous Gourmands - Beaujolais & Fromages","url":"https://www.meetup.com/meetup-group-frenchupyourlife/events/316568452/","description":"**Le Beaujolais Nouveau est arrivé… et ça se fête !** 🍷🧀\n\nGuidée par Marie-France Champagne, sommelière experte, découvrez une sélection de Beaujolais soigneusement choisie, sublimée par une dégustation de fromages savoureux, pensée pour révéler toute la richesse des accords entre vin et fromage.\n\nÂge minimum de participation : **19 ans**.\n\n\\-\\-\\-\\-\\-\\-\\-\\-\\-\\-\\-\\-\n\n**Celebrate Beaujolais Nouveau with an evening of fine wine, exceptional cheese, and French tradition.🍷🧀**\n\nEnjoy a curated selection of Beaujolais wines by wine expert Marie-France Champagne, thoughtfully paired with delicious cheeses to showcase the harmony between wine and cheese.\n\nMust be **19 years old and over** to participate.\n\n💲 50$ \\| 40$ membres & apprenants AF Ottawa\n🔗 [Détails de l'événement - Alliance Française Ottawa](https://af.ca/ottawa/details-de-levenement/?eventId=1367)","startDate":"2026-11-19T23:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-1-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Alliance Française Ottawa","address":{"@type":"PostalAddress","addressLocality":"Ottawa","addressRegion":"ON","addressCountry":"ca","streetAddress":"352 MacLaren St, Ottawa, ON K2P 0M6, Canada, Ottawa, ON"}},"organizer":{"@type":"Organization","name":"French Up Your Life - Alliance Française Ottawa","url":"https://www.meetup.com/meetup-group-frenchupyourlife/"},"performer":"French Up Your Life - Alliance Française Ottawa"}]</script></head></html>
